services:
  db:
    image: postgres:16-alpine
    container_name: kerjalab_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - kerjalab_net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kerjalab_app
    restart: unless-stopped
    ports:
      - "${NEXT_PUBLIC_APP_PORT}:3000"
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      DATABASE_URL: ${DATABASE_URL}
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    networks:
      - kerjalab_net

  adminer:
    image: adminer:4.8.1
    container_name: kerjalab_adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT}:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - kerjalab_net
    profiles:
      - tools

volumes:
  db_data:
    name: kerjalab_db_data

networks:
  kerjalab_net:
    name: kerjalab_net
    driver: bridge